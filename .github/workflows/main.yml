name: Windows Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check dependencies
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"

          Write-Host "=== Git ==="
          git --version

          Write-Host "=== Node ==="
          node --version

          Write-Host "=== Clang ==="
          clang --version

          Write-Host "=== LLC ==="
          llc --version

          Write-Host "=== OPT ==="
          opt --version

      - name: Check LLVM version
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"

          $llvm = & llc --version
          Write-Host $llvm

          if ($llvm -notmatch "LLVM version 2[0-9]") {
            Write-Error "LLVM 20 or newer is required."
            exit 1
          }

      - name: Detect Windows target
        shell: powershell
        run: |
          Write-Host "=== OS ==="
          [System.Environment]::OSVersion

          Write-Host "=== Architecture ==="
          $env:PROCESSOR_ARCHITECTURE

      - name: Build ZEN standard library
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"

          New-Item -ItemType Directory -Force -Path "src/zen_stdlib" | Out-Null

          llc -filetype=obj -relocation-model=pic `
            src/zen_stdlib/constants.ll `
            -o src/zen_stdlib/constants.o

          llc -filetype=obj -relocation-model=pic `
            src/zen_stdlib/zen_stdlib_opt.ll `
            -o src/zen_stdlib/zen_stdlib_opt.o

      - name: Build Windows runtime
        shell: powershell
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"

          clang -c -fPIC `
            src/codegen/runtime/w_runtime.c `
            -o src/codegen/runtime/runtime.o

          clang -c -fPIC `
            src/codegen/runtime/listRuntime.c `
            -o src/codegen/runtime/listRuntime.o

          clang -c -fPIC `
            src/codegen/runtime/jsonRuntime.c `
            -o src/codegen/runtime/jsonRuntime.o

          clang -c -fPIC `
            src/codegen/runtime/mapRuntime.c `
            -o src/codegen/runtime/mapRuntime.o

          clang -c -fPIC `
            src/codegen/runtime/httpRuntime.c `
            -o src/codegen/runtime/httpRuntime.o

      - name: Verify build artifacts
        shell: powershell
        run: |
          $artifacts = @(
            "src/zen_stdlib/constants.o",
            "src/zen_stdlib/zen_stdlib_opt.o",
            "src/codegen/runtime/runtime.o",
            "src/codegen/runtime/listRuntime.o",
            "src/codegen/runtime/jsonRuntime.o",
            "src/codegen/runtime/mapRuntime.o",
            "src/codegen/runtime/httpRuntime.o"
          )

          foreach ($file in $artifacts) {
            if (!(Test-Path $file)) {
              Write-Error "Missing artifact: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

      - name: Verify Zen CLI
        shell: powershell
        run: |
          node bin/zen.js --version
