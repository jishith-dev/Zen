name: Windows Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LLVM
        shell: powershell
        run: |
          choco install llvm -y --no-progress

      - name: Add LLVM to PATH
        shell: powershell
        run: |
          $llvmPath = "C:\Program Files\LLVM\bin"
          echo $llvmPath >> $env:GITHUB_PATH

      - name: Check dependencies
        shell: powershell
        run: |
          Write-Host "=== Git ==="
          git --version

          Write-Host "=== Node ==="
          node --version

          Write-Host "=== Clang ==="
          clang --version

          Write-Host "=== LLC ==="
          llc --version

          Write-Host "=== OPT ==="
          opt --version

      - name: Check libcurl
        shell: powershell
        run: |
          Write-Host "Checking for libcurl..."

          $curl = Get-Command curl.exe -ErrorAction SilentlyContinue

          if ($null -eq $curl) {
            Write-Error "curl.exe not found"
            exit 1
          }

          curl.exe --version

      - name: Build Zen
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"

          chmod +x bin/zen.js

          echo "=== Building Zen ==="
          bash install.sh

      - name: Verify Zen
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"

          echo "=== Zen version ==="
          node bin/zen.js --version

          echo "=== Zen help ==="
          node bin/zen.js --help
